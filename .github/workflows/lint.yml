name: Lint

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev lint tools if present
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif python -c "import tomllib, pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text()) if pathlib.Path('pyproject.toml').exists() else {}; exit(0 if 'ruff' in str(d) or 'flake8' in str(d) else 1)" 2>/dev/null; then
            pip install ruff
          fi

      - name: Validate Makefile syntax and targets
        run: |
          make -n help lint >/dev/null
          HELP_OUT="$(make help)"
          echo "$HELP_OUT"
          test -n "$HELP_OUT"
          DB="$(make -qp 2>/dev/null || true)"
          for target in help lint check-env up sync-triggers test-rack ci; do
            echo "$DB" | grep -Eq "^${target}:" || { echo "❌ Alvo obrigatório ausente no Makefile: ${target}"; exit 1; }
          done

      - name: Validate Docker Compose configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          docker compose config --quiet
          echo "✅ docker-compose.yml válido!"

      - name: Run make lint
        run: make lint
