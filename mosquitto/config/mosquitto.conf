# monitoramento-cpd/mosquitto/config/mosquitto.conf
# Laboratório: anônimo habilitado, sem TLS. Endurecer antes de expor.

# ---------------- Listeners ----------------
listener 1883
allow_anonymous true

listener 9001
protocol websockets

# ---------------- Persistência ----------------
persistence true
persistence_location /mosquitto/data/

# ---------------- Logs ----------------
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

# ---------------- Bridge (opcional) ----------------
# Para ligar a ponte com o broker público (Wokwi):
#   cp bridge.conf.example bridge.conf
# e descomente a linha abaixo:
#
include_dir /mosquitto/config/conf.d
