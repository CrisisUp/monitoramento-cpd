# monitoramento-cpd/mosquitto/config/mosquitto.conf
# Rede interna (1883/9001) + Listener mTLS (8883) com autenticação por certificado

# ---------------- Listeners ----------------
listener 1883
allow_anonymous true

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

listener 9001
protocol websockets
allow_anonymous true

# ---------------- Persistência ----------------
persistence true
persistence_location /mosquitto/data/

# ---------------- Logs ----------------
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

# ---------------- Bridge (opcional) ----------------
# Para ligar a ponte com o broker público (Wokwi):
#   cp bridge.conf.example bridge.conf
# e descomente a linha abaixo:
#
include_dir /mosquitto/config/conf.d