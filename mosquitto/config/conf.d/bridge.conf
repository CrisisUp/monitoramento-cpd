connection ponte-emqx
address broker.emqx.io:1883
clientid cpd-bridge-emqx

# topic <padrão> in <qos> <prefixo-local> <prefixo-remoto>
# Prefixo local: publico/
# Prefixo remoto: "" (vazio, pois o padrão já é o tópico remoto)
topic rack_monitor_ABCD1234/status      in 1 publico/ ""
topic rack_monitor_ABCD1234/ambiente    in 1 publico/ ""
topic rack_monitor_ABCD1234/logs        in 1 publico/ ""
topic rack_monitor_ABCD1234/heartbeat   in 1 publico/ ""
topic rack_monitor_ABCD1234/resposta    in 1 publico/ ""
topic rack_monitor_ABCD1234/status/lwt  in 1 publico/ ""

try_private true
notifications false
cleansession true
start_type automatic
restart_timeout 10