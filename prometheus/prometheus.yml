# ============================================================
# prometheus.yml — Configuração do Prometheus
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus (auto-monitoramento)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mosquitto (mensagens/s, clientes, fila)
  - job_name: 'mosquitto'
    static_configs:
      - targets: ['cpd-mosquitto-exporter:9234']

  # Containers Docker (CPU, memória, rede)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cpd-cadvisor:8080']

  # Host (CPU, memória, disco)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['cpd-node-exporter:9100']
