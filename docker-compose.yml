# ============================================================
# monitoramento-cpd/docker-compose.yml
# Stack completa: Mosquitto + Zabbix + Grafana + Postgres + Observabilidade
# ============================================================

services:
  # ---------------------------------------------------------------
  # Broker MQTT local (1883 interno/legado + 8883 mTLS + 9001 WS)
  # ---------------------------------------------------------------
  
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cpd-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8884:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - cpd-net
      - elo5-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ---------------------------------------------------------------
  # Banco de dados do Zabbix
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cpd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cpd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------
  # Zabbix Server
  # ---------------------------------------------------------------
  zabbix-server:
    build:
      context: ./zabbix-server-custom
      dockerfile: Dockerfile
    image: cpd-zabbix-server:custom
    container_name: cpd-zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./certs/ca.crt:/etc/zabbix/certs/ca.crt:ro
      - ./certs/zabbix-client.crt:/etc/zabbix/certs/zabbix-client.crt:ro
      - ./certs/zabbix-client.key:/etc/zabbix/certs/zabbix-client.key:ro
    ports:
      - "10051:10051"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - cpd-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10051' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------
  # Zabbix Web — interface + API
  # ---------------------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: cpd-zabbix-web
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
      - postgres
    networks:
      - cpd-net

  # ---------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.5
    container_name: cpd-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: "alexanderzobnin-zabbix-app, marcusolsson-dynamictext-panel"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "alexanderzobnin-zabbix-app,marcusolsson-dynamictext-panel"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/noc:/usr/share/grafana/public/grafana-custom/noc:ro
      - ./firmware:/usr/share/grafana/public/grafana-custom/firmware:ro
    networks:
      - cpd-net

  # ---------------------------------------------------------------
  # OBSERVABILIDADE — Prometheus + Exporters
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cpd-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - cpd-net
  mosquitto-exporter:
    image: jryberg/mosquitto-exporter:v0.7.9
    container_name: cpd-mosquitto-exporter
    restart: unless-stopped
    environment:
      BROKER_ENDPOINT: "tcp://cpd-mosquitto:1883"
    ports:
      - "9234:9234"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - cpd-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cpd-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - cpd-net

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: cpd-node-exporter
    restart: unless-stopped
    ports:
      - "9101:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - cpd-net

# ============================================================
# Redes
# ============================================================
networks:
  cpd-net:
    driver: bridge
  elo5-net:
    external: true
    name: elo5system2_elo5-net

# ============================================================
# Volumes
# ============================================================
volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  grafana_data:
  prometheus_data: